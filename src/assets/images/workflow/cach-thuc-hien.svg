<svg xmlns="http://www.w3.org/2000/svg" width="800" height="680" viewBox="0 0 800 680" font-family="Arial, Helvetica, sans-serif">
  <!-- Definitions / arrow marker -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- START node -->
  <ellipse cx="400" cy="45" rx="95" ry="30" fill="#ecfdf5" stroke="#16a34a" stroke-width="2.5"/>
  <text x="400" y="41" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">Bắt đầu</text>
  <text x="400" y="59" text-anchor="middle" font-size="12" fill="#475569">mở danh mục cần thao tác</text>

  <!-- arrow start - box1 -->
  <line x1="400" y1="75" x2="400" y2="112" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- BOX 1 -->
  <rect x="248" y="115" width="304" height="56" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="400" y="141" text-anchor="middle" font-size="16" font-weight="700" fill="#1e3a8a">Xem &amp; tìm bản ghi sẵn có</text>
  <text x="400" y="160" text-anchor="middle" font-size="12" fill="#475569">tìm kiếm theo từ khóa bất kỳ</text>

  <!-- arrow box1 - diamond -->
  <line x1="400" y1="171" x2="400" y2="215" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- DIAMOND decision -->
  <polygon points="400,218 505,260 400,302 295,260" fill="#fff7ed" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="400" y="255" text-anchor="middle" font-size="14" font-weight="700" fill="#92400e">Đã có bản ghi</text>
  <text x="400" y="273" text-anchor="middle" font-size="14" font-weight="700" fill="#92400e">cần cập nhật?</text>

  <!-- YES branch (right) -->
  <line x1="505" y1="260" x2="560" y2="260" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="532" y="251" text-anchor="middle" font-size="13" font-weight="700" fill="#16a34a">Có</text>

  <!-- BOX YES -->
  <rect x="561" y="233" width="150" height="52" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="636" y="263" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">Sửa ngay</text>

  <!-- yes down to merge line -->
  <line x1="636" y1="285" x2="636" y2="470" stroke="#2563eb" stroke-width="2.5"/>
  <line x1="636" y1="470" x2="400" y2="470" stroke="#2563eb" stroke-width="2.5"/>

  <!-- NO branch (down) -->
  <line x1="400" y1="302" x2="400" y2="340" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="414" y="326" font-size="13" font-weight="700" fill="#dc2626">Không</text>

  <!-- BOX NO -->
  <rect x="200" y="343" width="400" height="50" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="400" y="372" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">Thêm mới bên dưới</text>

  <!-- no down to merge line -->
  <line x1="400" y1="393" x2="400" y2="503" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- BOX 3 -->
  <rect x="205" y="506" width="390" height="58" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="400" y="533" text-anchor="middle" font-size="16" font-weight="700" fill="#1e3a8a">Xuất Excel / Nhập Excel</text>
  <text x="400" y="552" text-anchor="middle" font-size="12" fill="#475569">trao đổi dữ liệu với bảng tính</text>

  <!-- arrow box3 - end -->
  <line x1="400" y1="564" x2="400" y2="612" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- END node -->
  <ellipse cx="400" cy="648" rx="150" ry="32" fill="#ecfdf5" stroke="#16a34a" stroke-width="2.5"/>
  <text x="400" y="644" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Kết thúc — Đã lưu</text>
  <text x="400" y="663" text-anchor="middle" font-size="12" fill="#475569">tự động trên trình duyệt (localStorage)</text>
</svg>